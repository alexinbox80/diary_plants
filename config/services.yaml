# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    csvFilePrefix: 'var/data/entities/'
    csvSeparator: ';'
    csvImageFilePrefix: 'var/data/images/'
    uploadDirectory: '%kernel.project_dir%/public/uploads'
    webURL: '%env(string:WEB_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Domain\Service\Csv\Import\EntityImporterInterface:
            tags: [ 'app.entity_importer' ]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Controller\Cli\ConvertCSVCommand:
        class: App\Controller\Cli\ConvertCSVCommand
        tags: [ 'console.command' ]
        arguments:
            $csvFilePrefix: '%csvFilePrefix%'

    App\Domain\Service\PlantService:
        arguments:
            $webURL: '%webURL%'

    App\Infrastructure\Storage\LocalFileStorage:
        arguments:
            $uploadDirectory: '%uploadDirectory%'

    App\Domain\Service\Csv\Import\AttachmentImporter:
        arguments:
            $csvImageFilePrefix: '%csvImageFilePrefix%'

    # Настраиваем основной сервис CsvService
    App\Domain\Service\Csv\CsvService:
        arguments:
            # Передаем все сервисы, помеченные этим тегом
            $importers: !tagged_iterator app.entity_importer
            # Ваши строковые параметры из параметров приложения
            $csvSeparator: '%csvSeparator%'
