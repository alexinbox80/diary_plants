services:
    dplants_php-fpm:
        image: php:8.4-fpm-alpine
        build:
            dockerfile: Dockerfile
            context: ./docker/php-fpm
        container_name: 'dplants_php'
        depends_on:
            - dplants_postgres
        ports:
            - '9000:9000'
        volumes:
            - ./:/app
        working_dir: /app
        networks:
            - net

    dplants_nginx:
        image: nginx
        container_name: 'dplants_nginx'
        working_dir: /app
        ports:
            - '8080:80'
        volumes:
            - ./:/app
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - net

    dplants_postgres:
        image: postgres:15
        ports:
            - 5432:5432
        container_name: 'dplants_postgres'
        working_dir: /app
        restart: always
        environment:
            POSTGRES_DB: 'dplants'
            POSTGRES_USER: 'user'
            POSTGRES_PASSWORD: 'password'
        volumes:
            - dump:/app/dump
            - postgresql:/var/lib/postgresql/data
        networks:
            - net

#Docker Networks
networks:
    net:
        driver: bridge

#Docker Volumes
volumes:
    dump:
    postgresql:
